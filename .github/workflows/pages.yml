name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build site for repository URL
        run: |
          npm run build
          node scripts/prepare-github-pages.mjs
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-export
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
